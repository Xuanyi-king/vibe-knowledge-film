name: Core and optional WebGL
on:
  pull_request:
  push:
    branches: [feat/director-evidence-workflow]
  workflow_dispatch:
    inputs:
      webgl:
        description: Render and validate the existing eight-second WebGL example
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Fetch only the original guidance commit needed by the offline probe test
        run: git fetch --depth=1 origin 62d51508aad00003dc6209afa80c4b5dc540de59
      - name: FFmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'FFmpeg installation failed' }
          }
          ffmpeg -version
          ffprobe -version
      - name: Dependencies and browser
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          python engine/get_fonts.py
          python engine/get_fonts.py --check
      - name: Pin the test browser path
        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
                  f.write('VK_BROWSER=' + p.chromium.executable_path + '\n')
          PY
      - name: Core regression suite (no optional Three installation)
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee core-tests.log
      - name: Windows PowerShell entry point
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify.ps1 -SkipTests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-${{ runner.os }}
          path: core-tests.log
          retention-days: 7
  webgl:
    if: github.event_name == 'workflow_dispatch' && inputs.webgl
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VK_SOFTWARE_GL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          python engine/get_fonts.py
          python engine/get_scene_assets.py
      - run: |
          python -m unittest tests.test_scene -v
          python engine/render.py examples/resonance --resume 2
          python engine/render.py examples/resonance --events
          python engine/audio.py examples/resonance --stems
          python scripts/check_av.py examples/resonance
          python scripts/check_visual.py examples/resonance --video examples/resonance/renders/final.mp4 --require mallet-contact felt-contact
          python scripts/check_media.py examples/resonance/renders/final.mp4 --duration 8 --loudness
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optional-webgl-evidence
          path: |
            examples/resonance/renders/final.mp4
            examples/resonance/renders/*.provenance.json
            examples/resonance/audio/*.json
            examples/resonance/review/visual*
          retention-days: 7
